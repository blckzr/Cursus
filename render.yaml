# Render Blueprint — backend web service.
# Connect this repo in the Render dashboard; Render auto-detects render.yaml and
# provisions the service below. Secrets (DATABASE_URL, JWT_SECRET, CLIENT_ORIGIN)
# are marked sync:false — set them once in the Render dashboard, not in git.

services:
  - type: web
    name: cursus-backend
    runtime: node
    plan: free               # bump to "starter" for production traffic (no cold sleep)
    rootDir: apps/backend
    region: singapore        # closest region to PH

    # devDependencies (typescript, @types/*) are needed to compile, so we install
    # the full tree, build, then prune for a smaller runtime image.
    buildCommand: npm install --include=dev && npm run build && npm prune --omit=dev
    startCommand: npm run start

    healthCheckPath: /api/health

    autoDeploy: true
    branch: main

    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: JWT_EXPIRES_IN
        value: 8h
      # ── Secrets — set in Render dashboard, not git ─────────────────────────
      - key: DATABASE_URL
        sync: false           # Supabase pooler connection string (port 6543)
      - key: JWT_SECRET
        sync: false           # openssl rand -hex 64
      - key: CLIENT_ORIGIN
        sync: false           # Comma-separated list of Vercel URLs
      - key: CLIENT_ORIGIN_PATTERN
        sync: false           # Optional regex for Vercel preview URLs
